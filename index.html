<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generator Gambar Info Outlet</title>
<style>
:root{--bg:#f3f1ee;--panel:#fff;--ink:#1d1a17;--mut:#6b645c;--line:#ddd7cf;--acc:#c8261b}
@media (prefers-color-scheme:dark){:root{--bg:#161412;--panel:#221f1c;--ink:#f1ece6;--mut:#a39b91;--line:#383330}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;line-height:1.45}
.wrap{display:grid;grid-template-columns:minmax(300px,440px) 1fr;gap:24px;max-width:1280px;margin:0 auto;padding:20px}
@media(max-width:860px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mut);font-size:13px;margin:0 0 14px}
fieldset{border:0;border-top:1px solid var(--line);margin:14px 0 0;padding:12px 0 0}
legend{font-weight:700;font-size:14px;padding:0 6px 0 0}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input[type=text],textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink);font:inherit;font-size:14px}
textarea{min-height:92px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.row{display:flex;gap:10px;align-items:center}
.row label{margin:0}
input[type=color]{width:44px;height:34px;border:1px solid var(--line);border-radius:6px;background:none;padding:2px}
.hint{font-size:12px;color:var(--mut);margin-top:3px}
.chk{display:flex;gap:8px;align-items:center;color:var(--ink);margin:8px 0 0}
.preview{position:sticky;top:20px;align-self:start;text-align:center}
canvas{max-width:100%;height:auto;border-radius:8px;border:1px solid var(--line);background:#fff}
.btns{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
button{padding:10px 18px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
button.main{background:var(--acc);border-color:var(--acc);color:#fff}
</style>
</head>
<body>
<div class="wrap">
<div class="panel">
  <h1>Generator Info Outlet</h1>
  <p class="sub">Isi data di bawah, gambar di sebelah otomatis berubah. Klik Unduh PNG kalau sudah pas.</p>

  <fieldset><legend>Outlet</legend>
    <label for="nama">Nama outlet</label>
    <input type="text" id="nama" value="Sambal Mantap Outlet Pusat">
    <label for="tag">Tagline</label>
    <input type="text" id="tag" value="Pedasnya bikin nambah nasi">
    <div class="row" style="margin-top:10px">
      <input type="color" id="warna" value="#c8261b"><label for="warna">Warna tema</label>
    </div>
  </fieldset>

  <fieldset><legend>Jam buka</legend>
    <label for="jam">Satu baris satu jadwal, pisahkan dengan tanda |</label>
    <textarea id="jam">Senin - Jumat | 10.00 - 21.00
Sabtu | 10.00 - 22.00
Minggu | 11.00 - 20.00
Hari libur nasional | Tutup</textarea>
  </fieldset>

  <fieldset><legend>Aneka sambal</legend>
    <label for="sambal">Satu baris satu sambal. Tingkat pedas 1-5 setelah tanda | (boleh dikosongkan)</label>
    <textarea id="sambal">Sambal Bawang | 3
Sambal Matah | 2
Sambal Terasi | 4
Sambal Ijo | 3
Sambal Dabu-dabu | 4
Sambal Setan | 5</textarea>
    <label class="chk"><input type="checkbox" id="showLevel" checked> Tampilkan tingkat pedas</label>
  </fieldset>

  <fieldset><legend>Info pesanan</legend>
    <label for="pesan">Satu baris satu poin</label>
    <textarea id="pesan">Pesan lewat WhatsApp, GoFood, GrabFood, atau ShopeeFood
Pesanan dalam kota diantar 30-45 menit
Pesan untuk acara minimal H-1
Pembayaran tunai, QRIS, dan transfer</textarea>
  </fieldset>

  <fieldset><legend>Alamat dan kontak</legend>
    <label for="alamat">Alamat outlet</label>
    <textarea id="alamat" style="min-height:64px">Jl. Contoh Raya No. 12, Kelurahan Contoh, Kota Contoh</textarea>
    <label for="telp">Telepon / WhatsApp</label>
    <input type="text" id="telp" value="0812-3456-7890">
  </fieldset>

  <fieldset><legend>Kode</legend>
    <label class="chk"><input type="checkbox" id="showQR" checked> Tampilkan QR code</label>
    <label for="qr">Isi QR (link menu, Google Maps, atau wa.me)</label>
    <input type="text" id="qr" value="https://wa.me/6281234567890">
    <label class="chk"><input type="checkbox" id="showBar" checked> Tampilkan barcode</label>
    <label for="bar">Isi barcode (kode outlet / nomor pesanan)</label>
    <input type="text" id="bar" value="OUTLET-001">
    <div class="hint">Barcode format Code 128, huruf dan angka tanpa karakter khusus.</div>
  </fieldset>
</div>

<div class="preview">
  <canvas id="cv" width="1080" height="1400" aria-label="Pratinjau gambar info outlet"></canvas>
  <div class="btns">
    <button class="main" id="dl">Unduh PNG</button>
  </div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const FONT='"Trebuchet MS",Verdana,Arial,sans-serif';
const W=1080,PAD=60,CW=W-PAD*2,IN=36;

/* ---------- Code 128 (set B) ---------- */
const C128="212222,222122,222221,121223,121322,131222,122213,122312,132212,221213,221312,231212,112232,122132,122231,113222,123122,123221,223211,221132,221231,213212,223112,312131,311222,321122,321221,312212,322112,322211,212123,212321,232121,111323,131123,131321,112313,132113,132311,211313,231113,231311,112133,112331,132131,113123,113321,133121,313121,211331,231131,213113,213311,213131,311123,311321,331121,312113,312311,332111,314111,221411,431111,111224,111422,121124,121421,141122,141221,112214,112412,122114,122411,142112,142211,241211,221114,413111,241112,134111,111242,121142,121241,114212,124112,124211,411212,421112,421211,212141,214121,412121,111143,111341,131141,114113,114311,411113,411311,113141,114131,311141,411131,211412,211214,211232,2331112".split(",");
function code128(text){
  const vals=[104];
  for(const ch of text){const c=ch.charCodeAt(0);vals.push(c>=32&&c<=126?c-32:0)}
  let sum=104;for(let i=1;i<vals.length;i++)sum+=i*vals[i];
  vals.push(sum%103,106);
  return vals.map(v=>C128[v]).join("");
}

/* ---------- Helpers ---------- */
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function wrap(ctx,text,maxW){
  const out=[];
  for(const para of text.split("\n")){
    let line="";
    for(const word of para.split(/\s+/).filter(Boolean)){
      const t=line?line+" "+word:word;
      if(ctx.measureText(t).width>maxW&&line){out.push(line);line=word}else line=t;
    }
    out.push(line);
  }
  return out;
}
const lines=id=>$(id).value.split("\n").map(s=>s.trim()).filter(Boolean);
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  const f=c=>Math.max(0,Math.min(255,Math.round(c+amt)));
  return "rgb("+f(n>>16)+","+f((n>>8)&255)+","+f(n&255)+")";
}

/* ---------- Pelukis ---------- */
function paint(ctx,theme){
  const dark=shade(theme,-70);
  ctx.textBaseline="alphabetic";
  let y=0;

  // Latar
  ctx.fillStyle=dark;ctx.fillRect(0,0,W,4000);

  // Header
  ctx.fillStyle=theme;
  ctx.font="bold 78px "+FONT;
  const nameLines=wrap(ctx,$("nama").value||"Nama Outlet",CW);
  const tagLines=$("tag").value?1:0;
  const hdrH=70+nameLines.length*88+(tagLines?58:0)+40;
  ctx.fillRect(0,0,W,hdrH);
  ctx.fillStyle="#fff";ctx.textAlign="left";
  y=70+66;
  for(const l of nameLines){ctx.fillText(l,PAD,y);y+=88}
  y-=88;
  if($("tag").value){
    ctx.font="italic 34px "+FONT;ctx.fillStyle="rgba(255,255,255,.88)";
    ctx.fillText($("tag").value,PAD,y+56);y+=56;
  }
  y=hdrH+36;

  // Kartu bagian
  function section(title,fn){
    const innerW=CW-IN*2;
    const h=fn(ctx,0,0,innerW,true);
    const cardH=IN+54+h+IN-6;
    ctx.fillStyle="#fffaf4";rr(ctx,PAD,y,CW,cardH,22);ctx.fill();
    ctx.fillStyle=theme;ctx.font="bold 38px "+FONT;ctx.textAlign="left";
    ctx.fillText(title,PAD+IN,y+IN+34);
    ctx.fillRect(PAD+IN,y+IN+46,64,5);
    fn(ctx,PAD+IN,y+IN+54+14,innerW,false);
    y+=cardH+24;
  }

  // Jam buka
  const jam=lines("jam").map(s=>s.split("|").map(p=>p.trim()));
  if(jam.length)section("Jam Buka",(c,x,yy,w,dry)=>{
    let h=0;
    jam.forEach((r,i)=>{
      if(!dry){
        c.font="600 32px "+FONT;c.fillStyle="#2b221c";c.textAlign="left";c.fillText(r[0]||"",x,yy+h+36);
        c.textAlign="right";c.font="bold 32px "+FONT;
        c.fillStyle=/tutup/i.test(r[1]||"")?"#9a8f85":theme;
        c.fillText(r[1]||"",x+w,yy+h+36);
        if(i<jam.length-1){c.fillStyle="#e8dfd5";c.fillRect(x,yy+h+54,w,2)}
      }
      h+=62;
    });
    return h;
  });

  // Aneka sambal
  const sam=lines("sambal").map(s=>{const p=s.split("|");return{n:p[0].trim(),l:Math.max(0,Math.min(5,parseInt(p[1])||0))}});
  const showL=$("showLevel").checked;
  if(sam.length)section("Aneka Sambal",(c,x,yy,w,dry)=>{
    c.font="bold 30px "+FONT;
    let cx=0,cy=0;const ch=64,gap=14;
    for(const s of sam){
      const dots=showL&&s.l?s.l*17+10:0;
      const cwid=c.measureText(s.n).width+44+dots;
      if(cx+cwid>w&&cx>0){cx=0;cy+=ch+gap}
      if(!dry){
        c.fillStyle="#fff";rr(c,x+cx,yy+cy,cwid,ch,32);c.fill();
        c.strokeStyle=theme;c.lineWidth=3;c.stroke();
        c.fillStyle="#2b221c";c.textAlign="left";c.fillText(s.n,x+cx+22,yy+cy+42);
        if(dots){
          const dx=x+cx+22+c.measureText(s.n).width+22;
          for(let i=0;i<s.l;i++){c.fillStyle=theme;c.beginPath();c.arc(dx+i*17,yy+cy+32,6,0,7);c.fill()}
        }
      }
      cx+=cwid+gap;
    }
    return cy+ch;
  });

  // Info pesanan
  const pes=lines("pesan");
  if(pes.length)section("Info Pesanan",(c,x,yy,w,dry)=>{
    c.font="30px "+FONT;let h=0;
    for(const p of pes){
      const ls=wrap(c,p,w-40);
      if(!dry){
        c.fillStyle=theme;c.beginPath();c.arc(x+8,yy+h+22,7,0,7);c.fill();
        c.fillStyle="#2b221c";c.textAlign="left";
        ls.forEach((l,i)=>c.fillText(l,x+36,yy+h+32+i*42));
      }
      h+=ls.length*42+14;
    }
    return h;
  });

  // Lokasi + kode
  const useQR=$("showQR").checked&&$("qr").value.trim()&&typeof qrcode==="function";
  const useBar=$("showBar").checked&&$("bar").value.trim();
  const alamat=$("alamat").value.trim(),telp=$("telp").value.trim();
  if(alamat||telp||useQR||useBar)section("Lokasi dan Kontak",(c,x,yy,w,dry)=>{
    c.font="30px "+FONT;let h=0;
    if(alamat){const ls=wrap(c,alamat,w);ls.forEach((l,i)=>{if(!dry){c.fillStyle="#2b221c";c.textAlign="left";c.fillText(l,x,yy+34+i*42)}});h+=ls.length*42+6}
    if(telp){if(!dry){c.font="bold 32px "+FONT;c.fillStyle=theme;c.textAlign="left";c.fillText("Telp / WA  "+telp,x,yy+h+36)}h+=56}
    if(useQR||useBar){
      h+=14;const bs=260;
      if(!dry){
        let bx=x;
        if(useQR){
          const q=qrcode(0,"M");q.addData($("qr").value.trim());q.make();
          const n=q.getModuleCount(),cell=Math.floor((bs-24)/n),sz=cell*n;
          c.fillStyle="#fff";rr(c,bx,yy+h,bs,bs,14);c.fill();
          c.strokeStyle="#e8dfd5";c.lineWidth=2;c.stroke();
          const ox=bx+(bs-sz)/2,oy=yy+h+(bs-sz)/2;
          c.fillStyle="#000";
          for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))c.fillRect(ox+k*cell,oy+r*cell,cell,cell);
          bx+=bs+28;
        }
        if(useBar){
          const bw=x+w-bx;
          c.fillStyle="#fff";rr(c,bx,yy+h,bw,bs,14);c.fill();
          c.strokeStyle="#e8dfd5";c.lineWidth=2;c.stroke();
          const pat=code128($("bar").value.trim());
          let mods=0;for(const d of pat)mods+=+d;
          const m=Math.max(1,Math.floor((bw-60)/mods));
          let px=bx+(bw-m*mods)/2;
          c.fillStyle="#000";
          pat.split("").forEach((d,i)=>{const wd=+d*m;if(i%2===0)c.fillRect(px,yy+h+34,wd,bs-110);px+=wd});
          c.font="bold 28px "+FONT;c.textAlign="center";c.fillStyle="#000";
          c.fillText($("bar").value.trim(),bx+bw/2,yy+h+bs-24);
        }
      }
      h+=bs;
    }
    return h;
  });

  return y+16;
}

/* ---------- Render ---------- */
const cv=$("cv");
function render(){
  const theme=$("warna").value;
  const tmp=document.createElement("canvas");tmp.width=W;tmp.height=4000;
  let H;
  try{H=paint(tmp.getContext("2d"),theme)}catch(e){console.error(e);return}
  cv.width=W;cv.height=Math.ceil(H);
  paint(cv.getContext("2d"),theme);
}
let t;
document.querySelectorAll("input,textarea").forEach(el=>el.addEventListener("input",()=>{clearTimeout(t);t=setTimeout(render,120)}));
$("dl").addEventListener("click",()=>{
  cv.toBlob(b=>{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(b);
    a.download=($("nama").value||"info-outlet").toLowerCase().replace(/[^a-z0-9]+/g,"-")+".png";
    a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  });
});
render();
window.addEventListener("load",render);
</script>
</body>
</html>
