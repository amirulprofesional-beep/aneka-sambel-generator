<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Generator Poster Aneka Sambel</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#eeeeee;
    color:#222;
}

.wrapper{
    max-width:1400px;
    margin:auto;
    padding:25px;
}

h1{
    text-align:center;
    margin:0 0 20px;
}

.layout{
    display:grid;
    grid-template-columns:380px 1fr;
    gap:35px;
    align-items:start;
}

.panel{
    background:white;
    padding:22px;
    border-radius:18px;
    box-shadow:0 8px 30px rgba(0,0,0,.12);
}

.panel h2{
    margin-top:0;
    color:#b40000;
}

label{
    display:block;
    font-weight:bold;
    margin-top:15px;
    margin-bottom:6px;
}

input,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:9px;
    font-size:15px;
}

textarea{
    min-height:75px;
    resize:vertical;
}

button{
    border:0;
    border-radius:10px;
    padding:13px 18px;
    font-weight:bold;
    cursor:pointer;
    margin-top:15px;
}

.btn{
    background:#c40000;
    color:white;
}

.btn2{
    background:#222;
    color:white;
}

/* AREA PREVIEW */
.preview-area{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:10px;
}

/*
   UKURAN POSTER:
   9 cm x 13 cm
   dibuat dengan rasio yang sama
*/
.poster{
    width:450px;
    height:650px;
    position:relative;
    overflow:hidden;

    background:
        radial-gradient(circle at 18% 18%, rgba(255,70,70,.45) 0 3%, transparent 4%),
        radial-gradient(circle at 85% 25%, rgba(255,190,0,.22) 0 10%, transparent 11%),
        linear-gradient(145deg,#760000,#d00000 45%,#970000 100%);

    color:white;
    box-shadow:0 15px 40px rgba(0,0,0,.30);
}

/* pola titik kiri atas */
.poster::before{
    content:"";
    position:absolute;
    top:-20px;
    left:-20px;
    width:180px;
    height:180px;

    background-image:radial-gradient(#ff5a5a 2px,transparent 2.5px);
    background-size:20px 20px;

    opacity:.45;
}

/* lengkungan dekorasi */
.poster::after{
    content:"";
    position:absolute;
    right:-130px;
    top:-90px;
    width:390px;
    height:390px;

    border:35px solid rgba(255,255,255,.08);
    border-radius:50%;
}

/* HEADER */
.brand{
    position:absolute;
    top:30px;
    left:30px;
    right:30px;
    text-align:center;
    z-index:2;
}

.brand-name{
    display:inline-block;
    padding:7px 28px 4px;

    font-family:Georgia,serif;
    font-size:47px;
    font-weight:bold;
    font-style:italic;

    color:white;

    text-shadow:
        3px 3px 0 #8d0000,
        5px 5px 0 #ffffff;
}

.city{
    display:inline-block;
    margin-top:2px;
    padding:5px 40px;

    background:white;
    color:#a60000;

    font-size:20px;
    font-weight:900;
    letter-spacing:6px;

    clip-path:polygon(
        3% 20%,97% 0,
        94% 100%,6% 90%
    );
}

/* AREA UTAMA */
.main-title{
    position:absolute;
    top:175px;
    left:25px;
    right:25px;

    text-align:center;
    z-index:2;

    font-size:76px;
    line-height:.82;
    font-weight:1000;
    letter-spacing:-4px;

    text-transform:uppercase;

    color:white;

    text-shadow:
        7px 7px 0 #6f0000,
        11px 11px 0 #3d0000;
}

.main-title .yellow{
    display:block;
    color:#ffe04b;

    text-shadow:
        6px 6px 0 #870000,
        10px 10px 0 #4c0000;
}

/* efek garis / percikan */
.spark{
    position:absolute;
    z-index:1;
    width:85px;
    height:15px;
    background:#ffd72e;
    border-radius:50%;
    transform:rotate(48deg);
}

.spark.one{
    left:30px;
    top:235px;
}

.spark.two{
    right:20px;
    top:310px;
    transform:rotate(-48deg);
}

/* RESERVASI */
.reservation{
    position:absolute;
    left:25px;
    right:25px;
    top:445px;
    z-index:3;
}

.res-title{
    width:190px;
    margin:auto;
    padding:9px 10px;

    background:linear-gradient(#e52828,#a90000);
    border:3px solid #ffd42e;
    border-radius:30px;

    text-align:center;
    font-size:21px;
    font-weight:900;
}

.phone-box{
    margin-top:-2px;

    background:#fff;
    color:#111;

    border:3px solid #ffd42e;
    border-radius:18px;

    height:72px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:31px;
    font-weight:1000;
    letter-spacing:1px;

    box-shadow:0 7px 0 rgba(100,0,0,.4);
}

.whatsapp{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#20c963;
    color:white;

    display:flex;
    justify-content:center;
    align-items:center;

    margin-right:10px;
    font-size:25px;
}

/* BOTTOM */
.bottom{
    position:absolute;
    left:25px;
    right:25px;
    bottom:35px;

    display:grid;
    grid-template-columns:1fr 125px;
    gap:18px;

    z-index:3;
}

.address-box{
    min-height:125px;

    background:#fff;
    color:#111;

    border:3px solid #ffd42e;
    border-radius:20px;

    padding:18px;

    display:flex;
    align-items:center;
}

.address-icon{
    width:42px;
    height:52px;
    margin-right:12px;

    color:#d00000;
    font-size:42px;
    line-height:1;
}

.address-text{
    font-size:17px;
    font-weight:bold;
    line-height:1.25;
}

.address-label{
    color:#c00000;
    font-size:12px;
    font-weight:1000;
    margin-bottom:4px;
}

.qr-box{
    background:white;
    border:3px solid #ffd42e;
    border-radius:20px;

    padding:9px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

#qrcode{
    width:95px;
    height:95px;
}

.qr-text{
    margin-top:4px;
    background:#c40000;
    color:white;
    padding:5px 9px;
    border-radius:12px;

    font-size:11px;
    font-weight:1000;
}

/* garis emas bawah */
.gold-line{
    position:absolute;
    bottom:-15px;
    left:-40px;

    width:540px;
    height:55px;

    border-top:12px solid #ffd72e;
    border-radius:50%;
    transform:rotate(4deg);
}

/* responsive */
@media(max-width:850px){
    .layout{
        grid-template-columns:1fr;
    }

    .panel{
        max-width:500px;
        margin:auto;
    }

    .poster{
        transform:scale(.85);
        transform-origin:top center;
        margin-bottom:-90px;
    }
}
</style>
</head>

<body>

<div class="wrapper">

<h1>Generator Poster Aneka Sambel</h1>

<div class="layout">

<!-- =========================
     PANEL EDIT
========================= -->

<div class="panel">

<h2>✏️ Edit Poster</h2>

<label>Nama Outlet</label>
<input id="nama" value="Aneka Sambel"
       oninput="updatePoster()">

<label>Kota / Wilayah</label>
<input id="kota" value="MALANG"
       oninput="updatePoster()">

<label>Tulisan Utama</label>
<textarea id="judul"
          oninput="updatePoster()">KAMI|SUDAH|BUKA!</textarea>

<small>
Gunakan tanda <b>|</b> untuk membuat baris baru.
</small>

<label>Nomor Reservasi</label>
<input id="nomor" value="087752406609"
       oninput="updatePoster()">

<label>Alamat</label>
<textarea id="alamat"
oninput="updatePoster()">Sanur, Jotosanur, Kec. Tikung, Kabupaten Lamongan, Jawa Timur</textarea>

<label>Teks QR Code</label>
<input id="qrtext" value="SCAN LOKASI"
       oninput="updatePoster()">

<label>Link / Lokasi untuk QR Code</label>
<textarea id="qrurl"
oninput="updatePoster()">https://www.google.com/maps/search/?api=1&query=Sanur%2C+Jotosanur%2C+Kec.+Tikung%2C+Kabupaten+Lamongan%2C+Jawa+Timur</textarea>

<button class="btn" onclick="downloadPoster()">
⬇️ DOWNLOAD POSTER
</button>

<button class="btn2" onclick="resetPoster()">
↩️ RESET
</button>

</div>


<!-- =========================
     PREVIEW POSTER
========================= -->

<div class="preview-area">

<div class="poster" id="poster">

    <div class="brand">

        <div class="brand-name" id="pNama">
            Aneka Sambel
        </div>

        <div class="city" id="pKota">
            MALANG
        </div>

    </div>


    <div class="spark one"></div>
    <div class="spark two"></div>


    <div class="main-title" id="pJudul">
        <span>KAMI</span>
        <span class="yellow">SUDAH</span>
        <span>BUKA!</span>
    </div>


    <div class="reservation">

        <div class="res-title">
            RESERVASI:
        </div>

        <div class="phone-box">

            <div class="whatsapp">
                ☎
            </div>

            <span id="pNomor">
                087752406609
            </span>

        </div>

    </div>


    <div class="bottom">

        <div class="address-box">

            <div class="address-icon">
                📍
            </div>

            <div>

                <div class="address-label">
                    ALAMAT
                </div>

                <div class="address-text" id="pAlamat">
                    Sanur, Jotosanur, Kec. Tikung,
                    Kabupaten Lamongan, Jawa Timur
                </div>

            </div>

        </div>


        <div class="qr-box">

            <div id="qrcode"></div>

            <div class="qr-text" id="pQrText">
                SCAN LOKASI
            </div>

        </div>

    </div>


    <div class="gold-line"></div>

</div>

</div>

</div>

</div>


<script>

function updatePoster(){

    const nama =
        document.getElementById("nama").value;

    const kota =
        document.getElementById("kota").value;

    const judul =
        document.getElementById("judul").value;

    const nomor =
        document.getElementById("nomor").value;

    const alamat =
        document.getElementById("alamat").value;

    const qrtext =
        document.getElementById("qrtext").value;

    const qrurl =
        document.getElementById("qrurl").value;


    document.getElementById("pNama").textContent =
        nama;

    document.getElementById("pKota").textContent =
        kota;

    document.getElementById("pNomor").textContent =
        nomor;

    document.getElementById("pAlamat").textContent =
        alamat;

    document.getElementById("pQrText").textContent =
        qrtext;


    /*
       Judul otomatis dibuat per baris
    */

    const judulBox =
        document.getElementById("pJudul");

    judulBox.innerHTML = "";

    const baris =
        judul.split("|");

    baris.forEach((text,index)=>{

        const span =
            document.createElement("span");

        span.textContent = text;

        /*
          Baris kedua dibuat warna kuning
        */

        if(index === 1){
            span.className = "yellow";
        }

        judulBox.appendChild(span);

    });


    /*
       Buat ulang QR CODE
    */

    const qr =
        document.getElementById("qrcode");

    qr.innerHTML = "";

    if(qrurl.trim() !== ""){

        new QRCode(qr,{
            text:qrurl,
            width:95,
            height:95,
            correctLevel:QRCode.CorrectLevel.H
        });

    }

}


/*
   DOWNLOAD POSTER
*/

function downloadPoster(){

    const poster =
        document.getElementById("poster");

    html2canvas(poster,{
        scale:3,
        useCORS:true,
        backgroundColor:null
    }).then(canvas=>{

        const link =
            document.createElement("a");

        link.download =
            "poster-aneka-sambel.png";

        link.href =
            canvas.toDataURL("image/png");

        link.click();

    });

}


/*
   RESET
*/

function resetPoster(){

    document.getElementById("nama").value =
        "Aneka Sambel";

    document.getElementById("kota").value =
        "MALANG";

    document.getElementById("judul").value =
        "KAMI|SUDAH|BUKA!";

    document.getElementById("nomor").value =
        "087752406609";

    document.getElementById("alamat").value =
        "Sanur, Jotosanur, Kec. Tikung, Kabupaten Lamongan, Jawa Timur";

    document.getElementById("qrtext").value =
        "SCAN LOKASI";

    document.getElementById("qrurl").value =
        "https://www.google.com/maps/search/?api=1&query=Sanur%2C+Jotosanur%2C+Kec.+Tikung%2C+Kabupaten+Lamongan%2C+Jawa+Timur";

    updatePoster();

}


/*
   Jalankan pertama kali
*/

updatePoster();

</script>

</body>
</html>
