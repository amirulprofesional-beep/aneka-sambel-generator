<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator Poster Aneka Sambel</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#eeeeee;
  color:#222;
}

.wrap{
  max-width:1200px;
  margin:auto;
  padding:25px;
}

h1{
  text-align:center;
  margin:0 0 8px;
  font-size:32px;
}

.sub{
  text-align:center;
  color:#666;
  margin-bottom:25px;
}

.layout{
  display:grid;
  grid-template-columns:380px 1fr;
  gap:25px;
  align-items:start;
}

.panel{
  background:white;
  padding:22px;
  border-radius:18px;
  box-shadow:0 5px 25px #0002;
}

.panel h2{
  margin-top:0;
}

label{
  display:block;
  font-weight:bold;
  margin-top:15px;
  margin-bottom:6px;
}

input,
textarea,
button{
  width:100%;
  font:inherit;
}

input,
textarea{
  padding:11px;
  border:1px solid #ccc;
  border-radius:9px;
}

textarea{
  min-height:80px;
  resize:vertical;
}

input[type="color"]{
  height:45px;
  padding:3px;
}

button{
  border:0;
  padding:13px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  margin-top:12px;
}

.download{
  background:#d40000;
  color:white;
}

.reset{
  background:#eeeeee;
}

.preview-area{
  display:flex;
  justify-content:center;
  background:#ddd;
  padding:20px;
  border-radius:18px;
  overflow:auto;
}

/* POSTER */

#poster{
  width:720px;
  height:900px;
  flex:none;
  position:relative;
  overflow:hidden;
  background:#d40000;
  color:white;
  text-align:center;
  box-shadow:0 5px 25px #0004;
}

/* LOGO */

.logo{
  position:absolute;
  top:28px;
  left:35px;
  width:145px;
  height:100px;
  object-fit:contain;
  display:none;
}

/* NAMA OUTLET */

.outlet{
  position:absolute;
  top:48px;
  right:35px;
  left:200px;
  font-size:32px;
  font-weight:500;
  text-align:right;
}

/* JUDUL BESAR */

.main-title{
  position:absolute;
  top:145px;
  left:50px;
  right:50px;
  font-family:Georgia,serif;
  font-size:78px;
  line-height:.98;
  font-weight:900;
  color:white;
  text-shadow:
    4px 4px 0 #111,
    -2px -2px 0 #111,
    2px -2px 0 #111,
    -2px 2px 0 #111,
    0 0 25px #fff8;
}

/* RESERVASI */

.reserve-title{
  position:absolute;
  top:570px;
  left:0;
  right:0;
  font-size:32px;
  font-weight:bold;
}

.phone{
  position:absolute;
  top:620px;
  left:20px;
  right:20px;
  font-size:48px;
  font-weight:900;
  letter-spacing:2px;
}

/* ALAMAT */

.address{
  position:absolute;
  top:700px;
  left:150px;
  right:35px;
  font-size:25px;
  line-height:1.35;
  text-align:left;
  border-left:9px solid white;
  padding-left:22px;
}

/* FOTO MAKANAN */

.food{
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  height:220px;
  object-fit:cover;
  object-position:center;
  display:none;
}

/* TABLECLOTH */

.tablecloth{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:75px;
  background:
    repeating-linear-gradient(
      0deg,
      #fff 0,
      #fff 18px,
      #d22 18px,
      #d22 36px
    );
  opacity:.9;
  display:none;
}

@media(max-width:900px){

  .layout{
    grid-template-columns:1fr;
  }

  .panel{
    width:100%;
  }

  .preview-area{
    justify-content:flex-start;
  }

  #poster{
    transform-origin:top left;
  }
}
</style>
</head>

<body>

<div class="wrap">

<h1>🌶️ Generator Poster Aneka Sambel</h1>
<div class="sub">
Buat poster outlet sendiri — semua tulisan bisa diganti
</div>

<div class="layout">

<!-- FORM -->

<div class="panel">

<h2>✏️ Custom Poster</h2>

<label>Nama Outlet</label>
<input id="outletInput"
       value="Aneka Sambel Malang"
       oninput="updatePoster()">

<label>Judul Utama</label>
<textarea id="titleInput"
oninput="updatePoster()">Kami Sudah Buka!</textarea>

<label>Tulisan Reservasi</label>
<input id="reserveInput"
       value="Reservasi:"
       oninput="updatePoster()">

<label>Nomor WhatsApp</label>
<input id="phoneInput"
       value="087752406609"
       oninput="updatePoster()">

<label>Alamat</label>
<textarea id="addressInput"
oninput="updatePoster()">Sanur, Jotosanur, Kec. Tikung,
Kabupaten Lamongan, Jawa Timur</textarea>

<label>Warna Background</label>
<input type="color"
       id="bgInput"
       value="#d40000"
       oninput="updatePoster()">

<label>Upload Logo</label>
<input type="file"
       id="logoInput"
       accept="image/*"
       onchange="loadLogo(event)">

<label>Upload Foto Makanan</label>
<input type="file"
       id="foodInput"
       accept="image/*"
       onchange="loadFood(event)">

<button class="download" onclick="downloadPoster()">
⬇️ DOWNLOAD POSTER PNG
</button>

<button class="reset" onclick="resetForm()">
🔄 RESET
</button>

</div>


<!-- PREVIEW -->

<div class="preview-area">

<div id="poster">

<img id="logo"
     class="logo">

<div id="outlet"
     class="outlet">
Aneka Sambel Malang
</div>

<div id="mainTitle"
     class="main-title">
Kami Sudah Buka!
</div>

<div id="reserve"
     class="reserve-title">
Reservasi:
</div>

<div id="phone"
     class="phone">
087752406609
</div>

<div id="address"
     class="address">
Sanur, Jotosanur, Kec. Tikung,<br>
Kabupaten Lamongan, Jawa Timur
</div>

<img id="food"
     class="food">

<div class="tablecloth"
     id="cloth">
</div>

</div>

</div>

</div>

</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
</script>

<script>

function updatePoster(){

  document.getElementById("outlet").textContent =
    document.getElementById("outletInput").value ||
    "Nama Outlet";

  document.getElementById("mainTitle").textContent =
    document.getElementById("titleInput").value ||
    "Kami Sudah Buka!";

  document.getElementById("reserve").textContent =
    document.getElementById("reserveInput").value ||
    "Reservasi:";

  document.getElementById("phone").textContent =
    document.getElementById("phoneInput").value ||
    "Nomor WhatsApp";

  document.getElementById("address").innerHTML =
    document.getElementById("addressInput").value
    .replace(/\n/g,"<br>");

  document.getElementById("poster").style.background =
    document.getElementById("bgInput").value;
}


function loadLogo(event){

  const file = event.target.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(e){

    const logo = document.getElementById("logo");

    logo.src = e.target.result;
    logo.style.display = "block";

  };

  reader.readAsDataURL(file);
}


function loadFood(event){

  const file = event.target.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(e){

    const food = document.getElementById("food");
    const cloth = document.getElementById("cloth");

    food.src = e.target.result;
    food.style.display = "block";

    cloth.style.display = "block";

  };

  reader.readAsDataURL(file);
}


function resetForm(){

  document.getElementById("outletInput").value =
    "Aneka Sambel Malang";

  document.getElementById("titleInput").value =
    "Kami Sudah Buka!";

  document.getElementById("reserveInput").value =
    "Reservasi:";

  document.getElementById("phoneInput").value =
    "087752406609";

  document.getElementById("addressInput").value =
    "Sanur, Jotosanur, Kec. Tikung,\nKabupaten Lamongan, Jawa Timur";

  document.getElementById("bgInput").value =
    "#d40000";

  document.getElementById("logo").style.display =
    "none";

  document.getElementById("food").style.display =
    "none";

  document.getElementById("cloth").style.display =
    "none";

  updatePoster();
}


async function downloadPoster(){

  const poster = document.getElementById("poster");

  const canvas = await html2canvas(poster,{
    scale:2,
    useCORS:true,
    backgroundColor:null
  });

  const link = document.createElement("a");

  link.download =
    (document.getElementById("outletInput").value ||
    "poster-aneka-sambel") + ".png";

  link.href = canvas.toDataURL("image/png");

  link.click();
}


updatePoster();

</script>

</body>
</html>
