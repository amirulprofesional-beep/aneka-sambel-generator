<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Generator Poster Aneka Sambel</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#eeeeee;
    color:#222;
}

.app{
    min-height:100vh;
    display:flex;
    gap:25px;
    padding:25px;
}

/* ================= PANEL ================= */

.panel{
    width:430px;
    background:white;
    padding:25px;
    border-radius:18px;
    box-shadow:0 5px 25px rgba(0,0,0,.12);
}

.panel h1{
    margin:0 0 25px;
    color:#b40000;
    font-size:28px;
}

label{
    display:block;
    font-weight:bold;
    margin-top:17px;
    margin-bottom:7px;
}

input,
textarea{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:9px;
    font-size:16px;
    font-family:Arial;
}

textarea{
    min-height:85px;
    resize:vertical;
}

.help{
    font-size:12px;
    color:#777;
    margin-top:5px;
}

button{
    width:100%;
    border:0;
    padding:14px;
    border-radius:10px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    margin-top:20px;
}

.download{
    background:#b40000;
    color:white;
}

.download:hover{
    background:#8d0000;
}

/* ================= PREVIEW ================= */

.preview-area{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:10px;
}

/*
    POSTER:
    900 x 1300 px
    Rasio 9 : 13
*/

.poster{
    width:900px;
    height:1300px;
    max-width:100%;
    aspect-ratio:9 / 13;

    position:relative;
    overflow:hidden;

    background:
        radial-gradient(circle at 12% 10%,rgba(255,255,255,.12) 0 8px,transparent 9px),
        radial-gradient(circle at 90% 20%,rgba(255,255,255,.08) 0 80px,transparent 82px),
        linear-gradient(145deg,#8b0000,#d00000 45%,#a50000);

    color:white;
}

/* dekorasi */

.poster::before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    border:2px solid rgba(255,255,255,.10);
    border-radius:50%;
    top:-220px;
    right:-180px;
}

.poster::after{
    content:"";
    position:absolute;
    width:450px;
    height:450px;
    border:2px solid rgba(255,210,50,.20);
    border-radius:50%;
    bottom:-230px;
    left:-200px;
}

/* semua isi poster berada di atas dekorasi */

.poster-content{
    position:relative;
    z-index:5;
    height:100%;
    padding:65px;
    display:flex;
    flex-direction:column;
}

/* ================= HEADER ================= */

.brand{
    text-align:center;
}

.brand-name{
    font-family:Georgia,serif;
    font-size:72px;
    font-weight:bold;
    font-style:italic;
    line-height:.95;
    color:white;
    text-shadow:
        3px 3px 0 #6d0000,
        0 0 15px rgba(0,0,0,.3);
}

.city{
    display:inline-block;
    margin-top:18px;
    padding:10px 45px;
    background:white;
    color:#a50000;
    font-size:32px;
    font-weight:bold;
    letter-spacing:8px;
    transform:skew(-8deg);
}

/* ================= MAIN TITLE ================= */

.main-title{
    margin-top:65px;
    text-align:center;

    background:linear-gradient(180deg,#ffffff,#eeeeee);
    color:#a50000;

    border:8px solid #ffca28;
    border-radius:28px;

    padding:30px 25px;

    font-size:78px;
    font-weight:900;
    line-height:1.05;

    text-shadow:
        4px 5px 0 #650000;

    box-shadow:
        0 10px 0 #650000,
        0 18px 30px rgba(0,0,0,.25);

    white-space:pre-line;
}

/* ================= RESERVASI ================= */

.reservation{
    margin-top:55px;
}

.reservation-title{
    width:65%;
    margin:0 auto;
    background:#c90000;
    border:5px solid #ffca28;
    border-radius:50px;
    padding:15px;
    text-align:center;

    font-size:34px;
    font-weight:bold;
    letter-spacing:3px;

    box-shadow:0 6px 0 #650000;
}

.phone{
    margin-top:18px;
    background:white;
    color:#111;
    border:5px solid #ffca28;
    border-radius:22px;
    padding:18px;
    text-align:center;

    font-size:42px;
    font-weight:900;
    letter-spacing:2px;
}

/* ================= BOTTOM ================= */

.bottom{
    margin-top:auto;

    display:grid;
    grid-template-columns:1.45fr .8fr;
    gap:20px;
    align-items:stretch;
}

.info-card,
.qr-card{
    background:white;
    color:#111;

    border:5px solid #ffca28;
    border-radius:24px;

    min-height:230px;
}

/* alamat */

.info-card{
    padding:25px;
}

.info-title{
    color:#b00000;
    font-size:25px;
    font-weight:900;
    margin-bottom:15px;
}

.address{
    font-size:27px;
    font-weight:bold;
    line-height:1.3;
    white-space:pre-line;
}

/* QR */

.qr-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:15px;
}

#qrcode{
    width:165px;
    height:165px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.qr-label{
    margin-top:10px;
    background:#c90000;
    color:white;
    padding:8px 20px;
    border-radius:20px;

    font-size:18px;
    font-weight:bold;
}

/* ================= FOOTER ================= */

.footer{
    text-align:center;
    margin-top:18px;
    font-size:15px;
    opacity:.85;
}


/* ================= RESPONSIVE ================= */

@media(max-width:1000px){

    .app{
        flex-direction:column;
    }

    .panel{
        width:100%;
    }

    .preview-area{
        width:100%;
    }

    .poster{
        width:min(100%,900px);
        height:auto;
        aspect-ratio:9/13;
    }

    .poster-content{
        padding:7.2%;
    }

    .brand-name{
        font-size:8vw;
    }

    .city{
        font-size:3.5vw;
        padding:1.2% 5%;
    }

    .main-title{
        margin-top:7%;
        font-size:8.5vw;
        padding:3%;
        border-width:4px;
    }

    .reservation{
        margin-top:6%;
    }

    .reservation-title{
        font-size:4vw;
    }

    .phone{
        font-size:5vw;
    }

    .info-title{
        font-size:3vw;
    }

    .address{
        font-size:3.2vw;
    }

    #qrcode{
        width:14vw;
        height:14vw;
    }

    .qr-label{
        font-size:2.3vw;
    }
}

</style>
</head>


<body>

<div class="app">

<!-- ================= PANEL EDIT ================= -->

<div class="panel">

<h1>✏️ Edit Poster</h1>

<label>Nama Outlet</label>
<input id="outlet"
       value="Aneka Sambel"
       oninput="updatePoster()">

<label>Kota / Wilayah</label>
<input id="city"
       value="MALANG"
       oninput="updatePoster()">

<label>Tulisan Utama</label>
<textarea id="mainTitle"
          oninput="updatePoster()">KAMI
SUDAH
BUKA!</textarea>

<div class="help">
Gunakan Enter untuk membuat baris baru.
</div>

<label>Nomor Reservasi</label>
<input id="phone"
       value="087752406609"
       oninput="updatePoster()">

<label>Alamat</label>
<textarea id="address"
          oninput="updatePoster()">Sanur, Jotosanur,
Kec. Tikung,
Kabupaten Lamongan,
Jawa Timur</textarea>

<label>Teks QR Code</label>
<input id="qrText"
       value="https://maps.google.com/?q=Sanur+Jotosanur+Tikung+Lamongan"
       oninput="updateQR()">

<div class="help">
QR Code akan otomatis berubah sesuai tulisan di atas.
</div>

<button class="download"
        onclick="downloadPoster()">
⬇ DOWNLOAD POSTER
</button>

</div>


<!-- ================= POSTER ================= -->

<div class="preview-area">

<div class="poster" id="poster">

<div class="poster-content">

<!-- HEADER -->

<div class="brand">

<div class="brand-name"
     id="outletPreview">
Aneka Sambel
</div>

<div class="city"
     id="cityPreview">
MALANG
</div>

</div>


<!-- MAIN TITLE -->

<div class="main-title"
     id="titlePreview">
KAMI
SUDAH
BUKA!
</div>


<!-- RESERVASI -->

<div class="reservation">

<div class="reservation-title">
RESERVASI
</div>

<div class="phone"
     id="phonePreview">
087752406609
</div>

</div>


<!-- BOTTOM -->

<div class="bottom">

<div class="info-card">

<div class="info-title">
ALAMAT
</div>

<div class="address"
     id="addressPreview">
Sanur, Jotosanur,
Kec. Tikung,
Kabupaten Lamongan,
Jawa Timur
</div>

</div>


<div class="qr-card">

<div id="qrcode"></div>

<div class="qr-label">
SCAN LOKASI
</div>

</div>

</div>


<div class="footer">
Aneka Sambel • Selamat datang
</div>

</div>

</div>

</div>

</div>


<script>

/* ================= UPDATE POSTER ================= */

function updatePoster(){

    document.getElementById("outletPreview").textContent =
        document.getElementById("outlet").value;

    document.getElementById("cityPreview").textContent =
        document.getElementById("city").value;

    document.getElementById("titlePreview").textContent =
        document.getElementById("mainTitle").value;

    document.getElementById("phonePreview").textContent =
        document.getElementById("phone").value;

    document.getElementById("addressPreview").textContent =
        document.getElementById("address").value;

}


/* ================= QR CODE ================= */

function updateQR(){

    const qr = document.getElementById("qrcode");

    qr.innerHTML = "";

    const text =
        document.getElementById("qrText").value;

    new QRCode(qr,{
        text:text,
        width:165,
        height:165,
        correctLevel:QRCode.CorrectLevel.H
    });

}


/* ================= DOWNLOAD ================= */

function downloadPoster(){

    const poster =
        document.getElementById("poster");

    html2canvas(poster,{
        scale:3,
        useCORS:true,
        backgroundColor:null
    }).then(function(canvas){

        const link =
            document.createElement("a");

        link.download =
            "poster-aneka-sambel.png";

        link.href =
            canvas.toDataURL("image/png");

        link.click();

    });

}


/* ================= INITIAL ================= */

updatePoster();
updateQR();

</script>

</body>
</html>
