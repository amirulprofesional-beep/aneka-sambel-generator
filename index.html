<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Generator Poster Buka</title>
<link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#f6f1ee;--card:#fff;--tx:#2a1210;--bd:#e2d3cf;--ac:#a50d0d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b0f0e;--card:#2a1715;--tx:#f5e9e6;--bd:#4a2b28;--ac:#e04545}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Poppins,system-ui,sans-serif;padding:14px}
.wrap{max-width:520px;margin:auto}
h1{font-size:20px;margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:12px;font-weight:600;margin:10px 0 4px}
input,textarea{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
textarea{resize:vertical;min-height:60px}
button{width:100%;font:inherit;font-weight:700;font-size:16px;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;margin-top:10px}
button.alt{background:transparent;color:var(--ac);border:2px solid var(--ac)}
canvas,img.out{width:100%;height:auto;border-radius:10px;display:block}
.hint{font-size:12px;opacity:.75;margin-top:8px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<h1>🌶️ Generator Poster “Sudah Buka”</h1>
<div class="card">
<label>Nama usaha</label><input id="nama" value="Aneka Sambel">
<label>Kota / cabang</label><input id="kota" value="Malang">
<label>Headline baris 1</label><input id="h1" value="Kami Sudah">
<label>Headline baris 2</label><input id="h2" value="Buka!">
<label>Judul kotak kiri</label><input id="jl" value="Reservasi / Delivery Order">
<label>Nomor WhatsApp</label><input id="wa" inputmode="tel" value="0851-9667-5949">
<label>Judul kotak kanan</label><input id="jr" value="Inline Food">
<label>Deskripsi kotak kanan (Enter = baris baru)</label><textarea id="dr">Pesan lebih mudah
lewat Inline Food</textarea>
<label>Caption QR WhatsApp</label><input id="cw" value="Chat langsung untuk pemesanan!">
<label>Link Google Maps</label><input id="maps" inputmode="url" value="https://maps.google.com/?q=Jl.+Saxophone+No.8+Malang">
<label>Caption QR Lokasi</label><input id="cm" value="Temukan lokasi kami di Google Maps!">
<label>Alamat (Enter = baris baru)</label><textarea id="alamat">Jl. Saxophone No.8, Tunggulwulung,
Kec. Lowokwaru, Kota Malang, Jawa Timur 65143</textarea>
<label>Warna latar</label><input id="warna" type="color" value="#9b0505" style="height:44px;padding:4px">
</div>
<div class="card">
<canvas id="c" width="1080" height="1350"></canvas>
<button id="gen">Buat Gambar</button>
<button id="share" class="alt">Bagikan / Simpan</button>
<div id="res"></div>
<div class="hint">Rasio 4:5 (1080×1350 px). Di HP: tekan lama gambar hasil → Simpan.</div>
</div>
</div>
<script>
const $=id=>document.getElementById(id), c=$('c'), x=c.getContext('2d'), W=1080, H=1350, GOLD='#f6c667';
function rr(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r)}
function shade(hex,k){let n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.max(0,Math.min(255,Math.round(v*k)));return `rgb(${f(r)},${f(g)},${f(b)})`}
function txt(t,px,py,font,col,al='center',lh=36){x.font=font;x.fillStyle=col;x.textAlign=al;x.textBaseline='middle';t.split('\n').forEach((l,i)=>x.fillText(l,px,py+i*lh))}
function waLink(v){let d=v.replace(/\D/g,'');if(d.startsWith('0'))d='62'+d.slice(1);return 'https://wa.me/'+d}
function qr(text,px,py,size){
  const q=qrcode(0,'H');q.addData(text||' ');q.make();const n=q.getModuleCount(),cs=size/n;
  x.fillStyle='#fff';rr(px-18,py-18,size+36,size+36,22);x.fill();x.fillStyle='#111';
  for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect(px+k*cs,py+r*cs,cs+.6,cs+.6);
  }
function box(a,b,w,h){x.strokeStyle=GOLD;x.lineWidth=3;rr(a,b,w,h,40);x.stroke()}
function wrap(t,maxW,font){x.font=font;const out=[];t.split('\n').forEach(p=>{let line='';p.split(' ').forEach(w=>{const tr=line?line+' '+w:w;if(x.measureText(tr).width>maxW&&line){out.push(line);line=w}else line=tr});out.push(line)});return out}
function dot(cx,cy,r,col){x.fillStyle=col;x.beginPath();x.arc(cx,cy,r,0,7);x.fill()}
function pill(cx,cy,label,col){
  const f='700 30px Poppins';x.font=f;const tw=x.measureText(label).width,w=tw+100,l=cx-w/2;
  x.fillStyle=$('warna').value;x.strokeStyle=GOLD;x.lineWidth=3;rr(l,cy-30,w,60,30);x.fill();x.stroke();
  dot(l+36,cy,15,col);dot(l+36,cy,6,'#fff');
  txt(label,l+64,cy+2,f,'#fff','left');
}
function spark(sx,cy,dx){x.strokeStyle=GOLD;x.lineCap='round';x.lineWidth=9;
  [[-.5,55],[0,70],[.5,55]].forEach(([a,l])=>{const y0=cy+a*120;x.beginPath();x.moveTo(sx,y0);x.lineTo(sx+dx*l,y0+a*50);x.stroke()})}
function draw(){
  const bg=$('warna').value;
  let g=x.createRadialGradient(W/2,200,50,W/2,H/2,H*.8);g.addColorStop(0,shade(bg,1.3));g.addColorStop(1,shade(bg,.55));
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.strokeStyle=GOLD;x.lineWidth=3;rr(28,28,W-56,H-56,34);x.stroke();
  txt($('nama').value,W/2,82,'72px "Kaushan Script"','#fff');
  txt($('kota').value,W/2,148,'700 38px Poppins','#fff');
  x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.moveTo(370,148);x.lineTo(450,148);x.moveTo(630,148);x.lineTo(710,148);x.stroke();
  // brush + headline 1 (rotasi sama)
  x.save();x.translate(540,255);x.rotate(-.05);
  x.fillStyle=GOLD;rr(-310,-48,620,96,16);x.fill();
  txt($('h1').value,0,2,'86px "Kaushan Script"',shade(bg,.6));x.restore();
  // headline 2
  x.save();x.shadowColor='rgba(0,0,0,.45)';x.shadowBlur=12;x.shadowOffsetY=8;
  txt($('h2').value,540,425,'220px "Kaushan Script"','#fff');x.restore();
  x.strokeStyle=GOLD;x.lineWidth=9;x.lineCap='round';x.beginPath();x.moveTo(380,525);x.lineTo(700,512);x.stroke();
  spark(175,415,-1);spark(905,415,1);
  // info boxes
  box(60,600,440,165);box(555,600,465,165);
  x.fillStyle=bg;x.strokeStyle=GOLD;x.lineWidth=4;
  [[160,600],[640,600]].forEach(([a,b])=>{x.beginPath();x.arc(a,b+5,48,0,7);x.fill();x.stroke()});
  txt('📞',160,610,'44px sans-serif','#fff');txt('🍴',640,610,'44px sans-serif','#fff');
  txt($('jl').value.replace(' / ',' /\n'),225,645,'700 28px Poppins','#fff','left',34);
  x.fillStyle=GOLD;rr(85,704,395,50,25);x.fill();
  dot(122,729,16,'#25D366');dot(122,729,6,'#fff');
  txt($('wa').value,305,731,'700 32px Poppins',shade(bg,.6));
  txt($('jr').value,860,640,'700 36px Poppins','#fff');
  txt($('dr').value,860,700,'500 26px Poppins','#fff','center',34);
  // QR
  const bw=395,by=830,bh=355;
  [[95,'Scan WhatsApp','#25D366',waLink($('wa').value),$('cw').value,'💬'],[590,'Scan Lokasi','#ea4335',$('maps').value,$('cm').value,'📍']].forEach(([a,lab,col,link,cap,mid])=>{
    box(a,by,bw,bh);const cx=a+bw/2;
    pill(cx,by,lab,col);
    qr(link,cx-100,by+55,200);
    dot(cx,by+155,30,'#fff');dot(cx,by+155,26,col==='#25D366'?col:'#fff');
    txt(mid,cx,by+157,'34px sans-serif','#000');
    const ls=wrap(cap,bw-70,'italic 600 24px Poppins');
    ls.forEach((l,i)=>txt(l,cx,by+303+(i-(ls.length-1)/2)*30,'italic 600 24px Poppins','#fff'));
  });
  // alamat & footer
  dot(150,1228,15,GOLD);x.fillStyle=GOLD;x.beginPath();x.moveTo(136,1233);x.lineTo(164,1233);x.lineTo(150,1260);x.fill();dot(150,1228,6,shade(bg,.6));
  txt($('alamat').value,205,1235,'500 24px Poppins','#fff','left',33);
  x.strokeStyle=GOLD;x.lineWidth=2;x.beginPath();x.moveTo(330,1300);x.lineTo(500,1300);x.moveTo(580,1300);x.lineTo(750,1300);x.stroke();
  txt('🌶️',540,1300,'38px sans-serif','#fff');
}
let t;function sched(){clearTimeout(t);t=setTimeout(draw,150)}
document.querySelectorAll('input,textarea').forEach(e=>e.addEventListener('input',sched));
function out(){draw();$('res').innerHTML='<img class="out" style="margin-top:12px" src="'+c.toDataURL('image/png')+'" alt="Hasil poster">'}
$('gen').onclick=out;
$('share').onclick=()=>{draw();c.toBlob(async b=>{
  const f=new File([b],'poster-buka.png',{type:'image/png'});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){}
  out();
},'image/png')};
(document.fonts?Promise.all([document.fonts.load('72px "Kaushan Script"'),document.fonts.load('700 30px Poppins'),document.fonts.load('500 24px Poppins')]):Promise.resolve()).then(draw,draw);
draw();
</script>
</body>
</html>
