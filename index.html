<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Generator Poster Aneka Sambel</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#eeeeee;
    font-family:Arial,Helvetica,sans-serif;
    color:#222;
}

.app{
    width:100%;
    min-height:100vh;
    display:flex;
    gap:25px;
    padding:20px;
}

/* ================= PANEL ================= */

.panel{
    width:400px;
    flex-shrink:0;
    background:#fff;
    padding:25px;
    border-radius:18px;
    box-shadow:0 5px 25px rgba(0,0,0,.12);
}

.panel h1{
    margin:0 0 20px;
    color:#b00000;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:bold;
}

input,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:9px;
    font-size:16px;
    font-family:Arial,sans-serif;
}

textarea{
    min-height:80px;
    resize:vertical;
}

.help{
    margin-top:5px;
    color:#777;
    font-size:12px;
}

.download{
    width:100%;
    margin-top:20px;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#bd0000;
    color:white;
    font-size:17px;
    font-weight:bold;
}

/* ================= PREVIEW ================= */

.preview-area{
    flex:1;
    min-width:0;
    display:flex;
    justify-content:center;
    align-items:flex-start;
}

/* ================= POSTER ================= */

.poster{
    /*
       Poster asli:
       900 x 1300
       Rasio 9 : 13
    */

    width:min(900px,100%);
    aspect-ratio:9 / 13;
    position:relative;

    overflow:hidden;

    background:
        radial-gradient(
            circle at 12% 12%,
            rgba(255,255,255,.12) 0 7px,
            transparent 8px
        ),
        radial-gradient(
            circle at 88% 22%,
            rgba(255,255,255,.08) 0 90px,
            transparent 92px
        ),
        linear-gradient(
            145deg,
            #870000,
            #d00000 48%,
            #a00000
        );

    color:white;

    container-type:inline-size;
}

/* ================= DECORASI ================= */

.poster::before{
    content:"";
    position:absolute;

    width:60%;
    aspect-ratio:1;

    top:-25%;
    right:-20%;

    border:2px solid rgba(255,255,255,.12);
    border-radius:50%;
}

.poster::after{
    content:"";
    position:absolute;

    width:55%;
    aspect-ratio:1;

    bottom:-25%;
    left:-20%;

    border:2px solid rgba(255,210,50,.22);
    border-radius:50%;
}


/* ================= ISI POSTER ================= */

.poster-content{
    position:absolute;
    inset:0;

    padding:7.2%;

    display:flex;
    flex-direction:column;

    z-index:5;
}


/* ================= HEADER ================= */

.brand{
    text-align:center;
}

.brand-name{
    font-family:Georgia,serif;

    font-size:8cqw;
    line-height:1;

    font-weight:bold;
    font-style:italic;

    color:white;

    text-shadow:
        .35cqw .35cqw 0 #650000,
        0 0 1.5cqw rgba(0,0,0,.3);
}

.city{
    display:inline-block;

    margin-top:2cqw;

    padding:1cqw 5cqw;

    background:white;
    color:#a50000;

    font-size:3.2cqw;
    font-weight:bold;

    letter-spacing:.7cqw;

    transform:skew(-8deg);
}


/* ================= TULISAN UTAMA ================= */

.main-title{

    margin-top:6.5cqw;

    width:100%;

    min-height:24cqw;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:3cqw;

    background:linear-gradient(
        180deg,
        #ffffff,
        #eeeeee
    );

    color:#a50000;

    border:.7cqw solid #ffca28;

    border-radius:3cqw;

    font-size:7cqw;

    font-weight:900;

    line-height:1.05;

    white-space:pre-line;

    text-shadow:
        .4cqw .5cqw 0 #650000;

    box-shadow:
        0 1.1cqw 0 #650000,
        0 2cqw 3cqw rgba(0,0,0,.25);

    overflow:hidden;
}


/* ================= RESERVASI ================= */

.reservation{
    margin-top:5.5cqw;
}

.reservation-title{

    width:62%;

    margin:auto;

    padding:1.5cqw;

    text-align:center;

    background:#c90000;

    border:.55cqw solid #ffca28;

    border-radius:10cqw;

    font-size:3.4cqw;

    font-weight:bold;

    letter-spacing:.4cqw;

    box-shadow:
        0 .8cqw 0 #650000;
}

.phone{

    margin-top:2.5cqw;

    width:100%;

    padding:2cqw;

    text-align:center;

    background:white;

    color:#111;

    border:.55cqw solid #ffca28;

    border-radius:2.5cqw;

    font-size:4.7cqw;

    font-weight:900;

    letter-spacing:.15cqw;

    white-space:nowrap;
}


/* ================= BAGIAN BAWAH ================= */

.bottom{

    margin-top:auto;

    display:grid;

    grid-template-columns:1.45fr .85fr;

    gap:2.2cqw;

    min-height:18cqw;
}


/* ================= ALAMAT ================= */

.info-card{

    background:white;

    color:#111;

    border:.55cqw solid #ffca28;

    border-radius:2.5cqw;

    padding:2.5cqw;

    min-width:0;
}

.info-title{

    color:#b00000;

    font-size:2.8cqw;

    font-weight:900;

    margin-bottom:1.5cqw;
}

.address{

    font-size:2.7cqw;

    font-weight:bold;

    line-height:1.25;

    white-space:pre-line;

    overflow-wrap:anywhere;
}


/* ================= QR ================= */

.qr-card{

    background:white;

    color:#111;

    border:.55cqw solid #ffca28;

    border-radius:2.5cqw;

    padding:1.5cqw;

    min-width:0;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    overflow:hidden;
}

#qrcode{

    width:15cqw;
    height:15cqw;

    max-width:100%;
    max-height:100%;

    display:flex;

    justify-content:center;
    align-items:center;

    overflow:hidden;
}

#qrcode canvas,
#qrcode img{

    width:100% !important;
    height:100% !important;

    max-width:100%;
    max-height:100%;

    display:block;
}

.qr-label{

    margin-top:1cqw;

    padding:.8cqw 2cqw;

    background:#c90000;

    color:white;

    border-radius:2cqw;

    font-size:1.9cqw;

    font-weight:bold;

    white-space:nowrap;
}


/* ================= FOOTER ================= */

.footer{

    text-align:center;

    margin-top:1.5cqw;

    font-size:1.5cqw;

    opacity:.85;
}


/* ================= HP ================= */

@media(max-width:700px){

    .app{
        display:block;
        padding:10px;
    }

    .panel{
        width:100%;
        margin-bottom:25px;
    }

    .preview-area{
        width:100%;
        display:flex;
        justify-content:center;
    }

    .poster{
        width:100%;
        max-width:500px;
    }

}


/* ================= DESKTOP ================= */

@media(min-width:1200px){

    .poster{
        width:700px;
    }

}

</style>
</head>


<body>

<div class="app">

<!-- ================= PANEL EDIT ================= -->

<div class="panel">

<h1>✏️ Edit Poster</h1>

<label>Nama Outlet</label>

<input
id="outlet"
value="Aneka Sambel"
oninput="updatePoster()">


<label>Kota / Wilayah</label>

<input
id="city"
value="MALANG"
oninput="updatePoster()">


<label>Tulisan Utama</label>

<textarea
id="mainTitle"
oninput="updatePoster()">KAMI
SUDAH
BUKA!</textarea>

<div class="help">
Gunakan Enter untuk membuat baris baru.
</div>


<label>Nomor Reservasi</label>

<input
id="phone"
value="087752406609"
oninput="updatePoster()">


<label>Alamat</label>

<textarea
id="address"
oninput="updatePoster()">Sanur, Jotosanur,
Kec. Tikung,
Kabupaten Lamongan,
Jawa Timur</textarea>


<label>Teks QR Code</label>

<input
id="qrText"
value="https://maps.google.com/?q=Sanur+Jotosanur+Tikung+Lamongan"
oninput="updateQR()">

<div class="help">
Masukkan link Google Maps untuk QR lokasi.
</div>


<button
class="download"
onclick="downloadPoster()">

⬇ DOWNLOAD POSTER

</button>

</div>


<!-- ================= PREVIEW ================= -->

<div class="preview-area">

<div
class="poster"
id="poster">

<div class="poster-content">


<!-- HEADER -->

<div class="brand">

<div
class="brand-name"
id="outletPreview">
Aneka Sambel
</div>

<div
class="city"
id="cityPreview">
MALANG
</div>

</div>


<!-- TULISAN UTAMA -->

<div
class="main-title"
id="titlePreview">
KAMI
SUDAH
BUKA!
</div>


<!-- RESERVASI -->

<div class="reservation">

<div class="reservation-title">
RESERVASI
</div>

<div
class="phone"
id="phonePreview">
087752406609
</div>

</div>


<!-- BAGIAN BAWAH -->

<div class="bottom">


<div class="info-card">

<div class="info-title">
ALAMAT
</div>

<div
class="address"
id="addressPreview">
Sanur, Jotosanur,
Kec. Tikung,
Kabupaten Lamongan,
Jawa Timur
</div>

</div>


<div class="qr-card">

<div id="qrcode"></div>

<div class="qr-label">
SCAN LOKASI
</div>

</div>


</div>


<div class="footer">
Aneka Sambel • Selamat datang
</div>


</div>

</div>

</div>

</div>


<script>


/* ================= UPDATE ================= */

function updatePoster(){

    document.getElementById("outletPreview").textContent =
        document.getElementById("outlet").value;

    document.getElementById("cityPreview").textContent =
        document.getElementById("city").value;

    document.getElementById("titlePreview").textContent =
        document.getElementById("mainTitle").value;

    document.getElementById("phonePreview").textContent =
        document.getElementById("phone").value;

    document.getElementById("addressPreview").textContent =
        document.getElementById("address").value;

}


/* ================= QR ================= */

function updateQR(){

    const qr =
        document.getElementById("qrcode");

    qr.innerHTML = "";

    const text =
        document.getElementById("qrText").value;

    new QRCode(qr,{

        text:text,

        width:165,
        height:165,

        correctLevel:
            QRCode.CorrectLevel.H

    });

}


/* ================= DOWNLOAD ================= */

function downloadPoster(){

    const poster =
        document.getElementById("poster");

    html2canvas(poster,{

        scale:3,

        useCORS:true,

        backgroundColor:null

    }).then(function(canvas){

        const link =
            document.createElement("a");

        link.download =
            "poster-aneka-sambel.png";

        link.href =
            canvas.toDataURL("image/png");

        link.click();

    });

}


/* ================= START ================= */

updatePoster();
updateQR();

</script>

</body>
</html>
